<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Pour que la page s'adapte à l'écran du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma journée – Saisie AESH</title>

  <!-- Le "manifest" : la carte d'identité de l'appli (nom, icône, couleurs) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2F6F8F">

  <!-- Pour l'iPhone (Safari lit ces lignes plutôt que le manifest) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ma journée">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <header class="entete">
      <div class="ligne-haut">
        <p class="sur-titre">Ma journée · CP</p>
        <button type="button" class="bouton-son" id="son" aria-pressed="true">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondes" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          <span id="son-texte">Son activé</span>
        </button>
      </div>
      <h1>La journée de <span id="prenom">[Prénom]</span></h1>
      <p class="date" id="date"></p>
    </header>

    <!-- 1. Le moment de la journée -->
    <section>
      <h2>1. Quel moment ?</h2>
      <div class="onglets" id="onglets">
        <button type="button" class="onglet" data-moment="matin">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 18a7 7 0 0 1 14 0"/><path d="M3 18h18M12 5v3M5.6 9.6l1.4 1.4M18.4 9.6 17 11"/></svg>
          <span class="onglet-texte">Matin</span>
        </button>
        <button type="button" class="onglet" data-moment="midi">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="13" r="6"/><circle cx="12" cy="13" r="3"/><path d="M3 5v5a2 2 0 0 0 2 2V20M21 5v15"/></svg>
          <span class="onglet-texte">Midi</span>
        </button>
        <button type="button" class="onglet" data-moment="aprem">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="onglet-texte">Après-midi</span>
        </button>
      </div>
    </section>

    <!-- 2. Les activités : la grille est remplie par script.js -->
    <section>
      <h2>2. Qu'est-ce que tu as fait ?</h2>
      <p class="aide">L'enfant touche les images, l'AESH vérifie. Toucher encore pour enlever.</p>
      <div class="grille" id="grille"></div>
    </section>

    <!-- 3. L'humeur -->
    <section>
      <h2>3. Tu étais comment ?</h2>
      <div class="humeurs" id="humeurs">
        <button type="button" class="carte" data-humeur="bien">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8 14c1 1.5 2.4 2 4 2s3-.5 4-2"/></svg>
          <span>Content</span>
        </button>
        <button type="button" class="carte" data-humeur="moyen">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8.5 15h7"/></svg>
          <span>Bof</span>
        </button>
        <button type="button" class="carte" data-humeur="difficile">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8 16c1-1.5 2.4-2 4-2s3 .5 4 2"/></svg>
          <span>Pas content</span>
        </button>
      </div>
    </section>

    <!-- 4. La note -->
    <section>
      <label for="note" class="titre-label">4. Un petit mot pour la famille <span class="facultatif">(pour l'AESH, facultatif)</span></label>
      <textarea id="note" rows="4" placeholder="Ex. : il a bien aimé le dessin. Petite pause au calme après la récré."></textarea>
    </section>

    <!-- 5. Résumé et envoi -->
    <section>
      <p class="resume" id="resume"></p>
      <button type="button" class="bouton-envoyer" id="envoyer">Envoyer à la famille</button>
      <p class="confirmation" id="confirmation" role="status" hidden>
        Version test : la journée est enregistrée sur ce téléphone seulement.
      </p>
      <button type="button" class="bouton-effacer" id="effacer">Effacer et recommencer</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
